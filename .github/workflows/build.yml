name: Build Docker images


on:

  push:
    branches: 
      - "8.2"
      - "8.1"
      - "8.0"

  schedule:
    - cron: "0 0 * * 4"

  workflow_dispatch:


jobs:

  build_and_publish_82:
    name: Build and publish PHP 8.2 Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "8.2"

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push Docker image
        with:
          image: eworkssk/php-cli
          tags: 8.2, 8, latest
          registry: docker.io
          multiPlatform: true
          platform: linux/amd64,linux/arm64/v8
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build_and_publish_81:
    name: Build and publish PHP 8.1 Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "8.1"

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push Docker image
        with:
          image: eworkssk/php-cli
          tags: 8.1
          registry: docker.io
          multiPlatform: true
          platform: linux/amd64,linux/arm64/v8
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build_and_publish_80:
    name: Build and publish PHP 8.0 Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "8.0"

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push Docker image
        with:
          image: eworkssk/php-cli
          tags: 8.0
          registry: docker.io
          multiPlatform: true
          platform: linux/amd64,linux/arm64/v8
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
